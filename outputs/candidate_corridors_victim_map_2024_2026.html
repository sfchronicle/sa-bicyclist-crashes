27939, 29.498949543281114], [-98.35049637950503, 29.498769806444894], [-98.35011230304212, 29.49835884419579], [-98.34980723248769, 29.498007395649555], [-98.34920323086959, 29.497328588853986]], [[-98.37009431795661, 29.50829201728971], [-98.36928820238501, 29.507344205740633]]]}}]};
    const colors = ["#d73027", "#4575b4", "#1a9850", "#984ea3", "#f46d43", "#66bd63", "#3288bd", "#762a83", "#e66101"];

    const map = L.map('map').setView([29.4241, -98.4936], 11);

    const carto = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      {
        maxZoom: 19,
        subdomains: 'abcd',
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
      }
    );

    const osm = L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    );

    let tileErrors = 0;

    carto.on('tileerror', () => {
      tileErrors += 1;

      if (tileErrors > 4 && !map.hasLayer(osm)) {
        map.removeLayer(carto);
        osm.addTo(map);
      }
    });

    carto.addTo(map);

    const lines = L.layerGroup();
    const victimPoints = L.layerGroup();
    const bounds = L.latLngBounds([]);

    data.features.forEach(feature => {
      const properties = feature.properties;

      if (properties.kind === 'line') {
        const line = L.geoJSON(feature, {
          style: {
            color: colors[properties.group % colors.length],
            weight: 6,
            opacity: 0.85
          }
        });

        line.bindTooltip(
          'Candidate stretch ' +
          (properties.group + 1) +
          ' — ' +
          properties.roads
        );

        line.addTo(lines);
        bounds.extend(line.getBounds());
      }

      if (properties.kind === 'victim') {
        const latlng = [
          feature.geometry.coordinates[1],
          feature.geometry.coordinates[0]
        ];

        const marker = L.circleMarker(latlng, {
          radius: 6,
          color: properties.fatal ? '#111' : '#fff',
          weight: 2,
          fillColor: properties.fatal ? '#e67e22' : '#3478a4',
          fillOpacity: 0.95
        });

        marker.bindPopup(
          '<b>Crash ' + properties.crash + '</b><br>' +
          'Year: ' + properties.year + '<br>' +
          'Outcome: ' +
          (properties.fatal
            ? 'Fatal injury'
            : 'Suspected serious injury') +
          '<br>Age: ' + properties.age +
          '<br>Gender: ' + properties.gender +
          '<br>Helmet: ' + properties.helmet
        );

        marker.addTo(victimPoints);
        bounds.extend(latlng);
      }
    });

    lines.addTo(map);
    victimPoints.addTo(map);

    if (bounds.isValid()) {
      map.fitBounds(bounds, {
        padding: [30, 30]
      });
    }

    L.control.layers(
      {
        'CARTO Voyager': carto,
        'OpenStreetMap': osm
      },
      {
        'Candidate stretches': lines,
        'Victim points': victimPoints
      },
      {
        collapsed: false
      }
    ).addTo(map);
  </script>
